name: Deploy Staging

on:
  push:
    branches:
      - staging

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deploy_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment branch
        run: |
          echo "Deploying staging at commit ${{ github.sha }}"
          echo "Pusher: ${{ github.actor }}"

      - name: Check staging credentials
        id: creds
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SERVER_IP: ${{ secrets.STAGING_SERVER_IP }}
        run: |
          if [ -n "$STAGING_SSH_KEY" ] && [ -n "$STAGING_SERVER_IP" ]; then
            echo "credentials_ready=true" >> "$GITHUB_OUTPUT"
            echo "Staging credentials configured: yes"
          else
            echo "credentials_ready=false" >> "$GITHUB_OUTPUT"
            echo "Staging credentials configured: no"
          fi

      - name: Configure SSH
        if: steps.creds.outputs.credentials_ready == 'true'
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SERVER_IP: ${{ secrets.STAGING_SERVER_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$STAGING_SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H "$STAGING_SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy backend + frontend
        id: deploy
        if: steps.creds.outputs.credentials_ready == 'true'
        env:
          STAGING_SERVER_IP: ${{ secrets.STAGING_SERVER_IP }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh -i ~/.ssh/staging_key \
            -o StrictHostKeyChecking=yes \
            "${STAGING_USER}@${STAGING_SERVER_IP}" \
            "cd ${STAGING_PATH} && git pull origin staging && npm ci && npm run build --workspace frontend && pm2 startOrReload ecosystem.config.cjs --only iot-billing-backend"

          echo "deploy_url=http://${STAGING_SERVER_IP}" >> "$GITHUB_OUTPUT"

      - name: Post-deploy verification
        if: steps.creds.outputs.credentials_ready == 'true'
        env:
          STAGING_SERVER_IP: ${{ secrets.STAGING_SERVER_IP }}
        run: |
          sleep 10
          curl -sf "http://${STAGING_SERVER_IP}/health" \
            || echo "Health endpoint not exposed yet"

      - name: Deploy skipped (credentials not provisioned)
        if: steps.creds.outputs.credentials_ready != 'true'
        run: |
          echo "Skipping live deployment: STAGING_SSH_KEY / STAGING_SERVER_IP not configured."
          echo "Add the staging secrets (STAGING_SSH_KEY, STAGING_SERVER_IP, STAGING_USER, STAGING_PATH) to enable this step."