apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kafka-connect-sink-hpa
  namespace: billing
  labels:
    app: kafka-connect-sink
    component: ledger-ingress
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kafka-connect-sink
  minReplicas: 2
  maxReplicas: 20
  metrics:
    # Scale on the durable ledger stream's pending entries (shared with the
    # billing consumers) so the sink ramps as the intake rate rises past what
    # the fixed replica count can drain.
    - type: Pods
      pods:
        metric:
          name: stream_consumer_group_pending_entries
        target:
          type: AverageValue
          averageValue: "500"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min