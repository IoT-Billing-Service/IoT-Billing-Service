apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect-sink
  namespace: billing
  labels:
    app: kafka-connect-sink
    component: ledger-ingress
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kafka-connect-sink
  template:
    metadata:
      labels:
        app: kafka-connect-sink
        component: ledger-ingress
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: billing-consumer
      containers:
        - name: sink
          image: iot-billing/backend:latest
          command: ["node", "dist/stream/kafka_connect_worker.js"]
          env:
            - name: NODE_ENV
              value: "production"
            - name: KAFKA_CONNECT_SINK_ENABLED
              value: "true"
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: kafka-brokers
            - name: KAFKA_GROUP_ID
              value: "iot-billing-blockchain-sink"
            - name: KAFKA_BLOCKCHAIN_EVENTS_TOPIC
              value: "blockchain.events"
            - name: KAFKA_CONNECT_SINK_TASK_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_CONNECT_VERIFY_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: kafka-connect-verify-public-key
                  optional: true
            - name: KAFKA_SSL
              value: "true"
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: kafka-sasl-username
                  optional: true
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: kafka-sasl-password
                  optional: true
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: redis-url
            - name: TIMESCALEDB_URL
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: timescaledb-url
          ports:
            - containerPort: 3000
              name: metrics
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false